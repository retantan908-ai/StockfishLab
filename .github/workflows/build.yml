
name: Build StockfishLab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK tidak ditemukan"
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager tidak ditemukan"
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::File ZIP project tidak ditemukan di root repository"
            exit 1
          fi

          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          echo "ZIP ditemukan: $ZIP_FILE"
          find source -maxdepth 4 -type f | head -100

      - name: Locate Android Gradle project
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW="$(find source -type f -name gradlew -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew tidak ditemukan. ZIP harus berisi project Android lengkap."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StockfishLab-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
