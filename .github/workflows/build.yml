name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Runner GitHub sudah punya Android SDK (ANDROID_HOME), jadi cukup terima lisensi + pasang paket
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      # Project tidak punya gradlew, jadi Gradle dipasang langsung (AGP 8.7.3 butuh Gradle >= 8.9)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # Mendukung 2 kondisi: ZIP project di root repo, atau folder android/ sudah di-commit
      - name: Locate or extract Android project
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP: $ZIP_FILE"
            mkdir -p source
            unzip -q "$ZIP_FILE" -d source
            SETTINGS="$(find source -type f -name 'settings.gradle*' -not -path '*/node_modules/*' -print -quit)"
          else
            echo "No ZIP in root, searching repository..."
            SETTINGS="$(find . -maxdepth 4 -type f -name 'settings.gradle*' -print -quit)"
          fi
          test -n "$SETTINGS" || { echo "settings.gradle(.kts) tidak ditemukan"; exit 1; }
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shin-study-assistant-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
