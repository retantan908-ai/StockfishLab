
name: Build StockfishLab V3 Floating APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract V3 project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::ZIP project tidak ditemukan"
            exit 1
          fi

          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          GRADLEW="$(find source -type f -name gradlew -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew tidak ditemukan"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          chmod +x "$GRADLEW"

          echo "Project: $PROJECT_DIR"

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          npm install --no-save esbuild@0.25.0 chess.js@1.4.0 stockfish@19.0.1

      - name: Build JavaScript assets
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          ASSETS="app/src/main/assets"

          mkdir -p "$ASSETS/engine"

          if [ ! -f "$ASSETS/main-entry.js" ]; then
            echo "::error::main-entry.js tidak ditemukan"
            exit 1
          fi

          sed -i "s|from './vendor/chess.js'|from 'chess.js'|" \
            "$ASSETS/main-entry.js"

          ./node_modules/.bin/esbuild \
            "$ASSETS/main-entry.js" \
            --bundle \
            --platform=browser \
            --format=iife \
            --outfile="$ASSETS/main.js"

          ENGINE_JS="$(find node_modules/stockfish -type f \
            -name 'stockfish-19-lite-single.js' -print -quit)"

          ENGINE_WASM="$(find node_modules/stockfish -type f \
            -name 'stockfish-19-lite-single.wasm' -print -quit)"

          if [ -z "$ENGINE_JS" ] || [ -z "$ENGINE_WASM" ]; then
            echo "::error::File Stockfish JS atau WASM tidak ditemukan"
            exit 1
          fi

          cp "$ENGINE_JS" "$ASSETS/engine/"
          cp "$ENGINE_WASM" "$ASSETS/engine/"

          echo "Pemeriksaan aset:"
          ls -lh "$ASSETS/main.js"
          ls -lh "$ASSETS/engine/"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Build Android APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK tidak berhasil dibuat"
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StockfishLab-V3-Floating-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
